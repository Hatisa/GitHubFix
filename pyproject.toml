[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "githubfix"
version = "1.0.0"
description = "GitHubFix - GitHub smart connection assistant for Windows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
githubfix = "github_fix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
